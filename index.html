<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的知识库</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F8FAFC;
    --bg-card: #FFFFFF;
    --text: #1E293B;
    --text-secondary: #475569;
    --text-muted: #94A3B8;
    --accent: #2563EB;
    --accent-light: #DBEAFE;
    --border: #E2E8F0;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-hover: 0 10px 25px rgba(0,0,0,0.08), 0 4px 10px rgba(0,0,0,0.04);
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F172A;
      --bg-card: #1E293B;
      --text: #E2E8F0;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --accent: #60A5FA;
      --accent-light: #1E3A5F;
      --border: #334155;
      --shadow: 0 1px 3px rgba(0,0,0,0.3);
      --shadow-hover: 0 10px 25px rgba(0,0,0,0.4);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', 'Noto Sans SC', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 80px 24px 40px;
  }
  .header {
    text-align: center;
    margin-bottom: 48px;
  }
  .header h1 {
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .header p {
    color: var(--text-secondary);
    font-size: 1.05rem;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
    max-width: 800px;
    width: 100%;
  }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    text-decoration: none;
    color: var(--text);
    box-shadow: var(--shadow);
    transition: all 0.2s ease;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card:hover {
    box-shadow: var(--shadow-hover);
    transform: translateY(-2px);
    border-color: var(--accent);
  }
  .card-icon {
    font-size: 2rem;
    line-height: 1;
  }
  .card-title {
    font-size: 1.15rem;
    font-weight: 600;
  }
  .card-desc {
    color: var(--text-secondary);
    font-size: 0.9rem;
    line-height: 1.5;
  }
  .card-tag {
    display: inline-block;
    background: var(--accent-light);
    color: var(--accent);
    font-size: 0.75rem;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 100px;
    align-self: flex-start;
  }
  .footer {
    margin-top: 60px;
    color: var(--text-muted);
    font-size: 0.8rem;
  }
</style>
</head>
<body>
  <div class="header">
    <h1>📚 我的知识库</h1>
    <p>学习笔记与指南文档</p>
  </div>
  <div class="cards">
    <a class="card" href="claude-code-guide.html">
      <span class="card-icon">⚡</span>
      <span class="card-title">Claude Code 完全指南</span>
      <span class="card-desc">从安装到精通，全面掌握 Claude Code 的使用方法与最佳实践</span>
      <span class="card-tag">开发工具</span>
    </a>
    <a class="card" href="产品经理_完全指南.md">
      <span class="card-icon">🎯</span>
      <span class="card-title">产品经理完全指南</span>
      <span class="card-desc">从入门到进阶，理解产品经理的核心能力、方法论与成长路径</span>
      <span class="card-tag">产品思维</span>
    </a>
  </div>
  <div class="footer">
    Powered by GitHub Pages
  </div>
</body>
</html>
