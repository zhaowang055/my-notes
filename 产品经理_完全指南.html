<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产品经理完全指南</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAFAF8;
    --bg-card: #FFFFFF;
    --bg-code: #F1F5F9;
    --bg-callout-blue: #EFF6FF;
    --bg-callout-yellow: #FFFBEB;
    --bg-callout-green: #F0FDF4;
    --text: #1A1A2E;
    --text-secondary: #475569;
    --text-muted: #64748B;
    --accent: #2563EB;
    --accent-light: #DBEAFE;
    --border: #E2E8F0;
    --border-light: #F1F5F9;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --radius: 8px;
    --toc-width: 260px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F172A;
      --bg-card: #1E293B;
      --bg-code: #1E293B;
      --bg-callout-blue: #172554;
      --bg-callout-yellow: #422006;
      --bg-callout-green: #052E16;
      --text: #E2E8F0;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --accent: #60A5FA;
      --accent-light: #1E3A5F;
      --border: #334155;
      --border-light: #1E293B;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', 'Noto Sans SC', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
  }

  /* 顶部导航 */
  .topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 56px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 24px;
    z-index: 100;
    box-shadow: var(--shadow-sm);
  }
  .topbar a {
    color: var(--accent);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .topbar a:hover { text-decoration: underline; }
  .topbar-title {
    margin-left: 16px;
    color: var(--text);
    font-weight: 600;
    font-size: 0.95rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 目录侧边栏 */
  .toc-sidebar {
    position: fixed;
    top: 56px;
    left: 0;
    bottom: 0;
    width: var(--toc-width);
    padding: 24px 16px 24px 20px;
    overflow-y: auto;
    border-right: 1px solid var(--border);
    background: var(--bg-card);
    z-index: 50;
  }
  .toc-sidebar h3 {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 12px;
    font-weight: 600;
  }
  .toc-list {
    list-style: none;
  }
  .toc-list li { margin: 0; }
  .toc-list a {
    display: block;
    padding: 5px 10px;
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 0.82rem;
    line-height: 1.5;
    border-radius: 4px;
    border-left: 2px solid transparent;
    transition: all 0.15s ease;
  }
  .toc-list a:hover {
    color: var(--accent);
    background: var(--accent-light);
  }
  .toc-list a.active {
    color: var(--accent);
    border-left-color: var(--accent);
    background: var(--accent-light);
    font-weight: 500;
  }
  .toc-list .toc-h3 { padding-left: 24px; font-size: 0.78rem; }
  .toc-list .toc-h4 { padding-left: 38px; font-size: 0.75rem; }

  /* 移动端目录按钮 */
  .toc-toggle {
    display: none;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    font-size: 1.2rem;
    cursor: pointer;
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 200;
    box-shadow: 0 4px 12px rgba(37,99,235,0.3);
  }

  /* 主内容区 */
  .content {
    margin-left: var(--toc-width);
    padding: 80px 48px 80px 48px;
    max-width: 860px;
  }

  /* 文章样式 */
  .article h1 {
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 16px;
    line-height: 1.3;
  }
  .article h2 {
    font-size: 1.5rem;
    font-weight: 700;
    margin: 48px 0 16px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--border);
    scroll-margin-top: 72px;
  }
  .article h3 {
    font-size: 1.2rem;
    font-weight: 600;
    margin: 32px 0 12px;
    scroll-margin-top: 72px;
  }
  .article h4 {
    font-size: 1.05rem;
    font-weight: 600;
    margin: 24px 0 8px;
    scroll-margin-top: 72px;
  }
  .article p {
    margin-bottom: 16px;
    color: var(--text);
  }
  .article blockquote {
    border-left: 4px solid var(--accent);
    padding: 12px 20px;
    margin: 20px 0;
    background: var(--accent-light);
    border-radius: 0 var(--radius) var(--radius) 0;
    color: var(--text-secondary);
  }
  .article blockquote p { margin-bottom: 0; }
  .article ul, .article ol {
    margin: 0 0 16px 24px;
  }
  .article li { margin-bottom: 6px; }
  .article code {
    background: var(--bg-code);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.88em;
  }
  .article pre {
    background: var(--bg-code);
    padding: 16px 20px;
    border-radius: var(--radius);
    overflow-x: auto;
    margin: 16px 0;
    border: 1px solid var(--border);
  }
  .article pre code {
    background: none;
    padding: 0;
    font-size: 0.85rem;
    line-height: 1.6;
  }
  .article table {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0 24px;
    font-size: 0.9rem;
  }
  .article th {
    background: var(--bg-code);
    font-weight: 600;
    text-align: left;
    padding: 10px 14px;
    border: 1px solid var(--border);
  }
  .article td {
    padding: 10px 14px;
    border: 1px solid var(--border);
  }
  .article tr:nth-child(even) td {
    background: var(--border-light);
  }
  .article strong { font-weight: 600; }
  .article hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 32px 0;
  }
  .article a {
    color: var(--accent);
    text-decoration: none;
  }
  .article a:hover { text-decoration: underline; }

  /* 响应式 */
  @media (max-width: 900px) {
    .toc-sidebar {
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      width: 280px;
    }
    .toc-sidebar.open { transform: translateX(0); }
    .toc-toggle { display: flex; align-items: center; justify-content: center; }
    .content {
      margin-left: 0;
      padding: 72px 20px 60px;
    }
  }
</style>
</head>
<body>

<nav class="topbar">
  <a href="index.html">← 返回主页</a>
  <span class="topbar-title">产品经理完全指南</span>
</nav>

<aside class="toc-sidebar" id="tocSidebar">
  <h3>目录</h3>
  <ul class="toc-list" id="tocList"></ul>
</aside>

<button class="toc-toggle" id="tocToggle" aria-label="打开目录">📑</button>

<main class="content">
  <article class="article" id="article"></article>
</main>

<script>
(function() {
  const MD_FILE = '产品经理_完全指南.md';

  // 简易 Markdown → HTML 转换
  function mdToHtml(md) {
    let html = '';
    const lines = md.split('\n');
    let inCode = false;
    let inTable = false;
    let tableRows = [];
    let inList = false;
    let listType = '';
    let inBlockquote = false;
    let blockquoteLines = [];

    function flushBlockquote() {
      if (inBlockquote && blockquoteLines.length) {
        html += '<blockquote><p>' + blockquoteLines.join('<br>') + '</p></blockquote>\n';
        blockquoteLines = [];
        inBlockquote = false;
      }
    }
    function flushTable() {
      if (inTable && tableRows.length) {
        html += '<table>';
        tableRows.forEach(function(row, i) {
          const tag = i === 0 ? 'th' : 'td';
          const cells = row.split('|').map(function(s) { return s.trim(); }).filter(Boolean);
          if (i === 1) return; // separator row
          html += '<tr>' + cells.map(function(c) { return '<' + tag + '>' + inline(c) + '</' + tag + '>'; }).join('') + '</tr>';
        });
        html += '</table>\n';
        tableRows = [];
        inTable = false;
      }
    }
    function flushList() {
      if (inList) {
        html += '</' + listType + '>\n';
        inList = false;
      }
    }

    function inline(text) {
      return text
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
    }

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];

      // 代码块
      if (line.trim().startsWith('```')) {
        flushBlockquote(); flushTable(); flushList();
        if (inCode) {
          html += '</code></pre>\n';
          inCode = false;
        } else {
          html += '<pre><code>';
          inCode = true;
        }
        continue;
      }
      if (inCode) {
        html += line.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '\n';
        continue;
      }

      // 空行
      if (!line.trim()) {
        flushBlockquote(); flushTable(); flushList();
        continue;
      }

      // 标题
      const headingMatch = line.match(/^(#{1,6})\s+(.+)/);
      if (headingMatch) {
        flushBlockquote(); flushTable(); flushList();
        const level = headingMatch[1].length;
        const text = headingMatch[2].replace(/\s*\{[^}]*\}/, '');
        const id = 'h-' + text.replace(/[^\w一-鿿]+/g, '-').replace(/^-|-$/g, '');
        html += '<h' + level + ' id="' + id + '">' + inline(text) + '</h' + level + '>\n';
        continue;
      }

      // 表格
      if (line.trim().startsWith('|') && line.trim().endsWith('|')) {
        flushBlockquote(); flushList();
        if (!inTable) inTable = true;
        tableRows.push(line.trim());
        continue;
      } else {
        flushTable();
      }

      // 引用
      if (line.trim().startsWith('>')) {
        flushTable(); flushList();
        inBlockquote = true;
        blockquoteLines.push(inline(line.trim().replace(/^>\s*/, '')));
        continue;
      } else {
        flushBlockquote();
      }

      // 列表
      const ulMatch = line.match(/^(\s*)[-*]\s+(.+)/);
      const olMatch = line.match(/^(\s*)\d+\.\s+(.+)/);
      if (ulMatch || olMatch) {
        flushBlockquote(); flushTable();
        const match = ulMatch || olMatch;
        const type = ulMatch ? 'ul' : 'ol';
        if (!inList || listType !== type) {
          flushList();
          html += '<' + type + '>\n';
          inList = true;
          listType = type;
        }
        html += '<li>' + inline(match[2]) + '</li>\n';
        continue;
      } else {
        flushList();
      }

      // 分隔线
      if (/^---+$/.test(line.trim())) {
        flushBlockquote(); flushTable(); flushList();
        html += '<hr>\n';
        continue;
      }

      // 普通段落
      flushBlockquote(); flushTable(); flushList();
      html += '<p>' + inline(line) + '</p>\n';
    }
    flushBlockquote(); flushTable(); flushList();
    if (inCode) html += '</code></pre>\n';
    return html;
  }

  // 生成目录
  function buildToc() {
    const headings = document.querySelectorAll('.article h2, .article h3, .article h4');
    const tocList = document.getElementById('tocList');
    headings.forEach(function(h) {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent;
      a.className = 'toc-' + h.tagName.toLowerCase();
      a.addEventListener('click', function() {
        document.getElementById('tocSidebar').classList.remove('open');
      });
      li.appendChild(a);
      tocList.appendChild(li);
    });

    // 滚动高亮
    const tocLinks = tocList.querySelectorAll('a');
    const observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          tocLinks.forEach(function(a) { a.classList.remove('active'); });
          const active = tocList.querySelector('a[href="#' + entry.target.id + '"]');
          if (active) active.classList.add('active');
        }
      });
    }, { rootMargin: '-72px 0px -70% 0px' });
    headings.forEach(function(h) { observer.observe(h); });
  }

  // 加载 MD 文件
  fetch(MD_FILE)
    .then(function(r) { return r.text(); })
    .then(function(md) {
      document.getElementById('article').innerHTML = mdToHtml(md);
      buildToc();
    })
    .catch(function() {
      document.getElementById('article').innerHTML = '<p>加载文档失败，请确认 ' + MD_FILE + ' 文件存在。</p>';
    });

  // 移动端目录切换
  document.getElementById('tocToggle').addEventListener('click', function() {
    document.getElementById('tocSidebar').classList.toggle('open');
  });
  document.addEventListener('click', function(e) {
    var sidebar = document.getElementById('tocSidebar');
    var toggle = document.getElementById('tocToggle');
    if (!sidebar.contains(e.target) && !toggle.contains(e.target)) {
      sidebar.classList.remove('open');
    }
  });
})();
</script>
</body>
</html>
